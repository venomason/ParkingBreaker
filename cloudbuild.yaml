steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    env:
      - 'PB_EXPECTED_COMMIT=${_PB_BUILD_COMMIT}'
      - 'PB_BUILD_IMAGE_TAG=${_IMAGE_TAG}'
    args: ['deploy/check-build-inputs.sh']
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--build-arg', 'PB_BUILD_COMMIT=${_PB_BUILD_COMMIT}',
      '--build-arg', 'PB_API_ORIGIN=${_PB_API_ORIGIN}',
      '--build-arg', 'PB_PROVIDER_MODE=${_PB_PROVIDER_MODE}',
      '--build-arg', 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}',
      '-t', 'us-west1-docker.pkg.dev/neuraldraft-parkingbreaker/parkingbreaker/frontend:${_IMAGE_TAG}',
      '-f', 'web/Dockerfile',
      '.'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'sh'
    args:
      - '-ec'
      - >-
        docker run --rm --network none -i --entrypoint node
        us-west1-docker.pkg.dev/neuraldraft-parkingbreaker/parkingbreaker/frontend:${_IMAGE_TAG}
        --input-type=module - < deploy/check-frontend-start.mjs
images:
  - 'us-west1-docker.pkg.dev/neuraldraft-parkingbreaker/parkingbreaker/frontend:${_IMAGE_TAG}'
substitutions:
  _PB_BUILD_COMMIT: ''
  # Candidate-scoped tag. Pass the commit: --substitutions=_IMAGE_TAG=$COMMIT
  # Deployments must reference the immutable digest, never this tag.
  _IMAGE_TAG: ''
  _PB_API_ORIGIN: 'http://127.0.0.1:8000'
  _PB_PROVIDER_MODE: 'fake'
  _NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
