[project]
name = "parkingbreaker"
version = "0.1.0"
description = "ParkingBreaker: mailed parking-ticket appeals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1",
    "fastapi>=0.141.1",
    "fpdf2>=2.8",
    "lob-python==5.2.1",
    "openai>=2",
    "pillow>=12.3",
    "pypdf>=5",
    "stripe==16.0.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkingbreaker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "tests"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow_matrix: exhaustive scenario matrices excluded from fast checks"]
